{{ with site.Language.Params.Author.links }}
  <div class="flex flex-wrap gap-x-3 gap-y-1 text-base text-neutral-600 dark:text-neutral-400">
    {{ range $links := . }}
      {{ range $name, $url := $links }}
        {{ $key := lower $name }}
        {{ $href := $url }}
        {{ if eq $key "email" }}{{ $href = printf "mailto:%s" $url }}{{ end }}
        <a
          class="wiki-link transition-colors hover:text-primary-700 dark:hover:text-primary-400"
          href="{{ $href | safeURL }}"
          {{ if ne $key "email" }}target="_blank" rel="me noopener noreferrer"{{ end }}
        >[ {{ $key }} ]</a>
      {{ end }}
    {{ end }}
  </div>
{{ end }}
