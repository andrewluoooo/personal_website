{{ $align := .align | default "center" }}
{{ $justify := cond (eq $align "start") "justify-start" (cond (eq $align "end") "justify-end" "justify-center") }}
<div
  class="not-prose mx-auto mt-2 flex w-full max-w-md flex-row flex-nowrap items-center gap-2 {{ $justify }}"
  role="group"
  aria-label="Location: Atlanta, Georgia"
>
  {{/* Match author-links: parent uses text-2xl, icons are 1em in that scale */}}
  <span class="inline-flex shrink-0 text-2xl leading-none text-neutral-900 dark:text-neutral-100">
    <svg
      class="block"
      style="width: 1em; height: 1em"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path
        fill="currentColor"
        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"
      />
    </svg>
  </span>
  <span class="whitespace-nowrap text-base text-neutral-600 dark:text-neutral-400">Atlanta, Georgia</span>
</div>
