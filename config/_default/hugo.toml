# Must match the URL visitors use (canonical, RSS, Open Graph, sitemap).
# Wrong host breaks production; see relativeURLs below for local/test servers.
baseURL = "https://andluo.com/"
languageCode = "en"

# Include draft posts in listings and output (e.g. writings) when deploying.
buildDrafts = true

theme = "congo"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
